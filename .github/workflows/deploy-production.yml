name: Deploy to Vercel Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref/tag to deploy (e.g. v5.3.3)'
        required: true
        default: 'v5.3.3'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Verify .vercel/project.json exists
        run: |
          if [ ! -f .vercel/project.json ]; then
            echo "::error::.vercel/project.json missing — cannot link to Vercel project"
            exit 1
          fi
          echo "project.json found:"
          cat .vercel/project.json

      - name: Deploy to Vercel Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          echo "=== Deploying ref ${{ inputs.ref }} (commit $(git rev-parse HEAD)) to Production ==="
          vercel --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/deploy.log
          echo "## Vercel Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ inputs.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # 提取 Production URL(deploy 輸出最後的 inspection URL 或 Production domain)
          URL=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' /tmp/deploy.log | tail -1)
          DEPLOY_ID=$(grep -oE 'dpl_[A-Za-z0-9]+' /tmp/deploy.log | head -1)
          echo "production_url=$URL" >> $GITHUB_OUTPUT
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "### Production URL" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment ID" >> $GITHUB_STEP_SUMMARY
          echo "$DEPLOY_ID" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          echo "=== Deploy Complete ==="
          echo "Production URL: ${{ steps.deploy.outputs.production_url }}"
          echo "Deployment ID:  ${{ steps.deploy.outputs.deploy_id }}"
          echo "Ref:            ${{ inputs.ref }}"
          echo "Commit:         $(git rev-parse HEAD)"
